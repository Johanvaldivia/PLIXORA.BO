# =============================================================
# PLIXORA.BO — Nginx reverse proxy para el WhatsApp Bot
# Copiar a /etc/nginx/sites-available/plixora-bot y enlazar a sites-enabled
# Certbot agrega automáticamente el bloque server{443} con SSL.
# =============================================================

server {
    listen 80;
    server_name plixora-bot.duckdns.org;

    # Certbot redirige a HTTPS automáticamente.
    # Si no tienes Certbot, comenta la siguiente línea:
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name plixora-bot.duckdns.org;

    # Certbot genera estas líneas automáticamente:
    ssl_certificate /etc/letsencrypt/live/plixora-bot.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plixora-bot.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
